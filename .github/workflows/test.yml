name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # 单元测试和 API 测试
  unit-tests:
    name: Unit & API Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      AUTH_SECRET: ci-test-secret-ci-test-secret-32
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:1/unit_test
      ZAMMAD_URL: http://127.0.0.1:65535/
      ZAMMAD_API_TOKEN: ci-disabled
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Keep CI at the measured baseline while the stricter repository targets
      # remain visible through `npm run test:coverage`.
      - name: Run tests and enforce coverage baseline
        run: npm run test:coverage:ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7

  # E2E can create tickets. Keep it disabled until an isolated Zammad test
  # environment is explicitly configured at repository level.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: >-
      vars.ENABLE_ISOLATED_E2E == 'true' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ||
      github.base_ref == 'master' || github.base_ref == 'main' ||
      github.event_name == 'workflow_dispatch')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_service_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      NODE_ENV: test
      AUTH_SECRET: ci-test-secret-ci-test-secret-32
      NEXTAUTH_SECRET: ci-test-secret-ci-test-secret-32
      NEXTAUTH_URL: http://localhost:3010
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/customer_service_e2e_test
      NEXT_PUBLIC_ENABLE_MOCK_AUTH: 'true'
      ZAMMAD_URL: http://127.0.0.1:65535/
      ZAMMAD_API_TOKEN: ci-disabled
      ZAMMAD_WEBHOOK_SECRET: ci-webhook-secret
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Setup test environment
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/e2e/
          retention-days: 7

  # 类型检查和 Lint
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:1/lint_test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check
